<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Letreiro</title>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
  input[type=text] { width: 100%; font-size: 20px; padding: 8px; box-sizing: border-box; }
  button { font-size: 18px; padding: 10px 16px; margin: 4px 4px 4px 0; cursor: pointer; }
  #lista label { display: block; font-size: 20px; margin: 6px 0; }
  h3 { margin-bottom: 6px; }
</style>
</head>
<body>
<h2>Painel do Letreiro</h2>

<h3>Frase</h3>
<input type="text" id="texto" placeholder="Digite a frase">

<h3>Fonte</h3>
<select id="fonte" style="font-size:20px;padding:6px">
  <option value="Arial, Helvetica, sans-serif">Arial</option>
  <option value="Roboto, sans-serif">Roboto</option>
  <option value="Anton, sans-serif">Anton</option>
  <option value="'Bebas Neue', sans-serif">Bebas Neue</option>
  <option value="Orbitron, sans-serif">Orbitron (futurista)</option>
  <option value="'Press Start 2P', monospace">Press Start 2P (videogame)</option>
  <option value="Pacifico, cursive">Pacifico (cursiva)</option>
</select>

<h3>Velocidade: <span id="vv">200</span> (maior = mais rápido)</h3>
<input type="range" id="vel" min="50" max="1000" step="10" value="200" style="width:100%">
<div><button id="enviar">Enviar alterações</button></div>

<h3>Computadores conectados (ordem de passagem: 1º, 2º, 3º...)</h3>
<div id="lista">Nenhum computador conectado.</div>

<h3>Controle</h3>
<button id="atualizar">🔄 Atualizar todos os computadores</button><br>
<button id="iniciar">▶ Iniciar</button>
<button id="pausar">⏸ Pausar</button>
<button id="reiniciar">⟲ Reiniciar</button>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  let offset = 0, estado = null, telas = {}, off = {}, ordem = [];
  function ordenar(telas, ordem) {
    const ini = ordem.filter((k) => telas[k]);
    const resto = Object.keys(telas).filter((k) => !ini.includes(k))
      .sort((a, b) => telas[a].nome.localeCompare(telas[b].nome, 'pt', { numeric: true }));
    return ini.concat(resto);
  }
  const lerOrdem = (v) => Array.isArray(v) ? v : Object.values(v || {});
  const agora = () => Date.now() + offset;
  db.ref('.info/serverTimeOffset').on('value', (s) => offset = s.val() || 0);

  // Cria o estado inicial se ainda não existir
  db.ref('letreiro/estado').once('value', (s) => {
    if (!s.exists()) db.ref('letreiro/estado').set({
      texto: 'BEM-VINDOS À ESCOLA!', velocidade: 200, fonte: 'Arial, Helvetica, sans-serif', rodando: true, t0: agora(), tPausa: 0,
    });
  });

  let primeira = true;
  db.ref('letreiro/estado').on('value', (s) => {
    estado = s.val();
    if (estado && primeira) { primeira = false; texto.value = estado.texto; vel.value = estado.velocidade; vv.textContent = estado.velocidade; if (estado.fonte) fonte.value = estado.fonte; }
  });
  db.ref('letreiro/telas').on('value', (s) => { telas = s.val() || {}; desenhar(); });
  db.ref('letreiro/desativadas').on('value', (s) => { off = s.val() || {}; desenhar(); });
  db.ref('letreiro/ordem').on('value', (s) => { ordem = lerOrdem(s.val()); desenhar(); });

  function desenhar() {
    const chaves = ordenar(telas, ordem);
    lista.innerHTML = chaves.length ? '' : 'Nenhum computador conectado.';
    chaves.forEach((k, i) => {
      const l = document.createElement('label');
      const c = document.createElement('input');
      c.type = 'checkbox'; c.checked = !off[k];
      c.onchange = () => c.checked
        ? db.ref('letreiro/desativadas/' + k).remove()
        : db.ref('letreiro/desativadas/' + k).set(true);
      l.append(c, ' ' + (i + 1) + 'º — ' + telas[k].nome + ' ');
      const sobe = document.createElement('button'); sobe.textContent = '▲'; sobe.onclick = () => mover(chaves, i, -1);
      const desce = document.createElement('button'); desce.textContent = '▼'; desce.onclick = () => mover(chaves, i, 1);
      l.append(sobe, desce);
      lista.appendChild(l);
    });
  }

  function mover(chaves, i, d) {
    const j = i + d;
    if (j < 0 || j >= chaves.length) return;
    const n = chaves.slice();
    [n[i], n[j]] = [n[j], n[i]];
    db.ref('letreiro/ordem').set(n);
  }
  atualizar.onclick = () => db.ref('letreiro/recarregar').set(Date.now());

  vel.oninput = () => vv.textContent = vel.value;
  enviar.onclick = () => db.ref('letreiro/estado').update({ texto: texto.value, velocidade: +vel.value, fonte: fonte.value });
  iniciar.onclick = () => { if (estado && !estado.rodando) db.ref('letreiro/estado').update({ rodando: true, t0: estado.t0 + (agora() - estado.tPausa) }); };
  pausar.onclick = () => { if (estado && estado.rodando) db.ref('letreiro/estado').update({ rodando: false, tPausa: agora() }); };
  reiniciar.onclick = () => db.ref('letreiro/estado').update({ rodando: true, t0: agora() });
</script>
</body>
</html>
