<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letreiro</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
  #txt { position: absolute; top: 50%; left: 0; white-space: nowrap; color: #39ff14;
         font-weight: bold; font-size: 12vw; font-family: Arial, Helvetica, sans-serif; will-change: transform; z-index: 1; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #aviso { z-index: 2; position: absolute; bottom: 8px; left: 8px; color: #444; font-size: 14px; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Orbitron:wght@700&family=Pacifico&family=Press+Start+2P&family=Roboto:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="bg"></canvas>
<div id="txt"></div>
<div id="aviso"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Nome do computador: pela URL (?nome=PC 1), salvo no navegador, ou perguntado
  let nome = new URLSearchParams(location.search).get('nome') || localStorage.getItem('nome');
  while (!nome || !nome.trim()) nome = prompt('Nome deste computador (ex: PC 1, PC 2...):') || '';
  nome = nome.trim();
  localStorage.setItem('nome', nome);
  const chave = nome.replace(/[.$#\[\]\/]/g, '-');

  // Tecle N para trocar o nome deste computador
  document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'n') { localStorage.removeItem('nome'); location.href = location.pathname; }
  });

  // Presença: aparece na lista enquanto estiver conectado
  db.ref('.info/connected').on('value', (s) => {
    if (!s.val()) return;
    const r = db.ref('letreiro/telas/' + chave);
    r.onDisconnect().remove();
    r.set({ nome });
  });

  let offset = 0, estado = null, telas = {}, off = {}, ordem = [];
  function ordenar(telas, ordem) {
    const ini = ordem.filter((k) => telas[k]);
    const resto = Object.keys(telas).filter((k) => !ini.includes(k))
      .sort((a, b) => telas[a].nome.localeCompare(telas[b].nome, 'pt', { numeric: true }));
    return ini.concat(resto);
  }
  const lerOrdem = (v) => Array.isArray(v) ? v : Object.values(v || {});
  db.ref('.info/serverTimeOffset').on('value', (s) => offset = s.val() || 0);
  db.ref('letreiro/estado').on('value', (s) => { estado = s.val(); });
  db.ref('letreiro/telas').on('value', (s) => telas = s.val() || {});
  db.ref('letreiro/desativadas').on('value', (s) => off = s.val() || {});
  db.ref('letreiro/ordem').on('value', (s) => ordem = lerOrdem(s.val()));

  // Botão "Atualizar todos" do painel: recarrega esta página
  let primeiraRec = true;
  db.ref('letreiro/recarregar').on('value', () => {
    if (primeiraRec) { primeiraRec = false; return; }
    location.reload();
  });

  const el = document.getElementById('txt');
  const aviso = document.getElementById('aviso');

  // ---------- Fundo animado (matrix / teia) ----------
  const cv = document.getElementById('bg'), cx = cv.getContext('2d');
  let fundoAtual = '', cols = [], pts = [], ultimo = 0;
  const letras = 'アイウエオカキクケコサシスセソ0123456789ABCDEFXYZ<>{}[]#$%&';

  function iniciarFundo() {
    cx.fillStyle = '#000'; cx.fillRect(0, 0, cv.width, cv.height);
    cols = Array.from({ length: Math.floor(cv.width / 18) }, () => Math.floor(Math.random() * -40));
    const q = Math.max(30, Math.floor(cv.width * cv.height / 25000));
    pts = Array.from({ length: q }, () => ({
      x: Math.random() * cv.width, y: Math.random() * cv.height,
      vx: (Math.random() - 0.5) * 1.2, vy: (Math.random() - 0.5) * 1.2,
    }));
  }
  function ajustar() { cv.width = innerWidth; cv.height = innerHeight; iniciarFundo(); }
  addEventListener('resize', ajustar);

  function desenharFundo(agora) {
    const f = (estado && estado.fundo) || 'nenhum';
    if (f !== fundoAtual) { fundoAtual = f; iniciarFundo(); if (f === 'nenhum') cx.clearRect(0, 0, cv.width, cv.height); }
    if (f === 'matrix' && agora - ultimo > 90) {
      ultimo = agora;
      cx.fillStyle = 'rgba(0,0,0,0.12)'; cx.fillRect(0, 0, cv.width, cv.height);
      cx.font = '16px monospace'; cx.fillStyle = '#0b7a34';
      cols.forEach((y, i) => {
        cx.fillText(letras[Math.floor(Math.random() * letras.length)], i * 18, y * 18);
        cols[i] = (y * 18 > cv.height && Math.random() > 0.975) ? 0 : y + 1;
      });
    } else if (f === 'teia') {
      cx.fillStyle = '#000'; cx.fillRect(0, 0, cv.width, cv.height);
      pts.forEach((p) => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > cv.width) p.vx *= -1;
        if (p.y < 0 || p.y > cv.height) p.vy *= -1;
        cx.fillStyle = '#1d6fa5'; cx.beginPath(); cx.arc(p.x, p.y, 2, 0, 6.283); cx.fill();
      });
      for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
        const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
        if (d < 150) {
          cx.strokeStyle = `rgba(29,111,165,${1 - d / 150})`;
          cx.beginPath(); cx.moveTo(pts[i].x, pts[i].y); cx.lineTo(pts[j].x, pts[j].y); cx.stroke();
        }
      }
    }
    requestAnimationFrame(desenharFundo);
  }

  function animar() {
    if (estado) {
      el.textContent = estado.texto;
      el.style.fontFamily = estado.fonte || 'Arial, Helvetica, sans-serif';
      el.style.fontSize = (estado.tamanho || 12) + 'vw';
      el.style.color = estado.cor || '#39ff14';
      const lista = ordenar(telas, ordem).filter((k) => !off[k]);
      const idx = lista.indexOf(chave);
      aviso.textContent = nome + (idx < 0 ? ' (desativado)' : '') + ' — tecle N para trocar o nome';
      el.style.display = idx < 0 ? 'none' : '';
      if (idx >= 0) {
        const W = innerWidth;
        const u = el.offsetWidth / W; // largura do texto em "telas"
        const v = estado.velocidade / 1000; // telas por segundo
        const agora = Date.now() + offset;
        const e = Math.max(0, ((estado.rodando ? agora : estado.tPausa) - estado.t0) / 1000);
        if (estado.modo === 'sequencia') {
          // um computador por vez
          const T = (1 + u) / v;
          const vez = Math.floor(e / T) % lista.length;
          el.style.visibility = vez === idx ? 'visible' : 'hidden';
          el.style.transform = `translate(${(-u + (e % T) * v) * W}px, -50%)`;
        } else {
          // contínuo: o texto atravessa todas as telas emendado
          const g = (estado.moldura || 0) / 100; // espaço da moldura entre as telas
          const P = lista.length + (lista.length - 1) * g;
          const x = -u + ((e * v) % (P + u));
          el.style.visibility = 'visible';
          el.style.transform = `translate(${(x - idx * (1 + g)) * W}px, -50%)`;
        }
      }
    } else {
      aviso.textContent = nome + ' — aguardando o painel (admin.html)...';
    }
    requestAnimationFrame(animar);
  }
  animar();
  ajustar();
  requestAnimationFrame(desenharFundo);
</script>
</body>
</html>
